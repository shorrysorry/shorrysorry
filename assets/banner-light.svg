<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="300" viewBox="0 0 1200 300" role="img" aria-label="shorrysorry — Frontend Engineer, AI-native">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#ffffff"/><stop offset="1" stop-color="#f6f8fa"/></linearGradient>
    <radialGradient id="glow1" cx="0.85" cy="0.15" r="0.5"><stop offset="0" stop-color="#c15f3c" stop-opacity="0.28"/><stop offset="1" stop-color="#c15f3c" stop-opacity="0"/></radialGradient>
    <radialGradient id="glow2" cx="0.65" cy="1" r="0.55"><stop offset="0" stop-color="#5160e6" stop-opacity="0.22"/><stop offset="1" stop-color="#5160e6" stop-opacity="0"/></radialGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse"><path d="M32 0H0V32" fill="none" stroke="#d0d7de" stroke-width="1" opacity="0.45"/></pattern>
    <linearGradient id="fade" x1="0" x2="1"><stop offset="0" stop-color="#fff" stop-opacity="0"/><stop offset="0.45" stop-color="#fff" stop-opacity="0.9"/><stop offset="1" stop-color="#fff" stop-opacity="0.3"/></linearGradient>
    <mask id="gm"><rect width="1200" height="300" fill="url(#fade)"/></mask>
    <linearGradient id="title" x1="0" x2="1"><stop offset="0" stop-color="#1f2328"/><stop offset="1" stop-color="#c15f3c"/></linearGradient>
    <style>
      .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
      .sans { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; }
      .cursor { animation: blink 1.1s steps(1) infinite; }
      @keyframes blink { 50% { opacity: 0; } }
      @media (prefers-reduced-motion: reduce) { .cursor { animation: none; } }
    </style>
  </defs>
  <rect width="1200" height="300" rx="16" fill="url(#bg)"/>
  <rect width="1200" height="300" rx="16" fill="url(#grid)" mask="url(#gm)"/>
  <rect width="1200" height="300" rx="16" fill="url(#glow1)"/>
  <rect width="1200" height="300" rx="16" fill="url(#glow2)"/>
  <text x="64" y="92" class="mono" font-size="20" fill="#59636e"><tspan fill="#1a7f37">~/shorrysorry</tspan> $ whoami</text>
  <text x="62" y="162" class="sans" font-size="64" font-weight="700" letter-spacing="-1.5" fill="url(#title)">shorrysorry</text>
  <text x="64" y="206" class="sans" font-size="24" fill="#1f2328" opacity="0.9">Frontend Engineer <tspan fill="#59636e">·</tspan> AI-native Developer</text>
  <text x="64" y="248" class="mono" font-size="18" fill="#59636e"><tspan fill="#1a7f37">$</tspan> plan → build → verify → ship, with agents<tspan class="cursor" fill="#c15f3c"> ▍</tspan></text>
  <g transform="translate(905 70)" class="mono" font-size="15" opacity="0.95">
    <rect width="235" height="160" rx="12" fill="#ffffff" fill-opacity="0.65" stroke="#d0d7de"/>
    <circle cx="20" cy="20" r="5" fill="#ff5f57"/><circle cx="38" cy="20" r="5" fill="#febc2e"/><circle cx="56" cy="20" r="5" fill="#28c840"/>
    <text x="20" y="58" fill="#59636e">agents:</text>
    <text x="36" y="84" fill="#1f2328"><tspan fill="#c15f3c">◆</tspan> explore</text>
    <text x="36" y="106" fill="#1f2328"><tspan fill="#5160e6">◆</tspan> plan · build</text>
    <text x="36" y="128" fill="#1f2328"><tspan fill="#1a7f37">◆</tspan> review · qa</text>
  </g>
</svg>
